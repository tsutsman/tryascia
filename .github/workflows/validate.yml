name: Validate ТРЯСЦЯ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate corpus and evals
        run: npm test
      - name: Verify generated corpus is committed
        run: git diff --exit-code -- skills/tryascia/references/korpus.json
      - name: Validate shell syntax
        run: bash -n install.sh install-codex.sh tests/installer-smoke.sh tests/release-ref-smoke.sh
      - name: Smoke-test installers
        run: bash tests/installer-smoke.sh
      - name: Smoke-test ref installers
        run: bash tests/release-ref-smoke.sh

  finalize_rc1:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/rc1-corpus-and-evals'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate and validate 75/25 corpus
        run: npm test
      - name: Assert RC corpus counts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('skills/tryascia/references/korpus.json', 'utf8'));
          if (corpus.record_count !== 100 || corpus.accepted_record_count !== 75 || corpus.candidate_record_count !== 25 || corpus.runtime_records.length !== 75) {
            throw new Error(`Unexpected corpus counts: ${corpus.record_count}/${corpus.accepted_record_count}/${corpus.candidate_record_count}/${corpus.runtime_records.length}`);
          }
          NODE
      - name: Commit generated corpus and restore normal CI
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tryascia/references/korpus.json .github/workflows/validate.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "chore: generate rc1 corpus"
          git push origin "HEAD:${BRANCH}"
