name: Validate ТРЯСЦЯ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate corpus and evals
        run: npm test
      - name: Verify generated corpus is committed
        run: git diff --exit-code -- skills/tryascia/references/korpus.json
      - name: Validate shell syntax
        run: bash -n install.sh install-codex.sh tests/installer-smoke.sh tests/release-ref-smoke.sh
      - name: Smoke-test installers
        run: bash tests/installer-smoke.sh
      - name: Smoke-test ref installers
        run: bash tests/release-ref-smoke.sh

  promote_beta3:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/corpus-beta3-50'
    needs: corpus
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v7
        with:
          ref: agent/corpus-beta3-50
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Wire verified anchors and raise release gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          validator = Path('scripts/validate-corpus.mjs')
          text = validator.read_text(encoding='utf-8')
          marker = '};\n\nconst rowPattern ='
          if 'verified-anchors-beta3.json' not in text:
              if marker not in text:
                  raise SystemExit('validator insertion marker not found')
              injected = '''};

const additionalExactCitationsPath = path.join(root, "evals/verified-anchors-beta3.json");
const additionalExactCitations = JSON.parse(fs.readFileSync(additionalExactCitationsPath, "utf8"));
for (const [form, citations] of Object.entries(additionalExactCitations)) {
  if (exactCitations[form]) {
    throw new Error("Дубль exact citation для форми: " + form);
  }
  exactCitations[form] = citations;
}

const rowPattern ='''
              validator.write_text(text.replace(marker, injected, 1), encoding='utf-8')

          policy_path = Path('evals/corpus-policy.json')
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          policy['release_gate']['minimum_accepted_records'] = 50
          policy['release_gate']['maximum_candidate_records'] = 50
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          readme = Path('README.md')
          readme_text = readme.read_text(encoding='utf-8')
          old = 'Корпус містить 100 форм: 30 мають exact anchor, 70 залишаються кандидатами для редакторської перевірки.'
          new = 'Корпус містить 100 форм: 50 мають exact anchor, 50 залишаються кандидатами для редакторської перевірки.'
          if old in readme_text:
              readme_text = readme_text.replace(old, new, 1)
          elif new not in readme_text:
              raise SystemExit('README corpus summary marker not found')
          readme.write_text(readme_text, encoding='utf-8')
          PY
      - name: Regenerate and validate promoted corpus
        run: npm test
      - name: Assert 50/50 corpus
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('skills/tryascia/references/korpus.json', 'utf8'));
          const actual = {
            records: corpus.record_count,
            accepted: corpus.accepted_record_count,
            candidate: corpus.candidate_record_count,
            runtime: Array.isArray(corpus.runtime_records) ? corpus.runtime_records.length : null,
          };
          if (actual.records !== 100 || actual.accepted !== 50 || actual.candidate !== 50 || actual.runtime !== 50) {
            throw new Error(`Unexpected corpus counts: ${JSON.stringify(actual)}`);
          }
          console.log('OK: 100 records; 50 accepted; 50 candidate; 50 runtime records.');
          NODE
      - name: Commit promoted corpus
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/validate-corpus.mjs evals/corpus-policy.json README.md skills/tryascia/references/korpus.json
          if git diff --cached --quiet; then
            echo "Corpus already promoted"
            exit 0
          fi
          git commit -m "feat: raise verified corpus gate to 50"
          git push origin HEAD:agent/corpus-beta3-50
