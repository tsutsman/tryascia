name: Validate ТРЯСЦЯ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate corpus
        run: npm test
      - name: Validate shell syntax
        run: bash -n install.sh install-codex.sh install-absurd.sh install-absurd-codex.sh tests/installer-smoke.sh
      - name: Smoke-test installers
        run: bash tests/installer-smoke.sh
