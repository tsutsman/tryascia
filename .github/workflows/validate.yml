name: Validate ТРЯСЦЯ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate corpus, evals and install manifest
        run: npm test
      - name: Verify generated corpus is committed
        run: git diff --exit-code -- skills/tryascia/references/korpus.json
      - name: Validate shell syntax
        run: bash -n install.sh install-codex.sh install-hermes.sh install-openclaw.sh scripts/install-common.sh tests/installer-smoke.sh tests/release-ref-smoke.sh tests/installer-atomicity.sh
      - name: Smoke-test installers
        run: bash tests/installer-smoke.sh
      - name: Smoke-test installer atomicity
        run: bash tests/installer-atomicity.sh
      - name: Smoke-test ref installers
        run: bash tests/release-ref-smoke.sh
