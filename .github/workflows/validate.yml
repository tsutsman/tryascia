name: Validate ТРЯСЦЯ

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Validate corpus and evals
        run: npm test
      - name: Verify generated corpus is committed
        run: git diff --exit-code -- skills/tryascia/references/korpus.json
      - name: Validate shell syntax
        run: bash -n install.sh install-codex.sh tests/installer-smoke.sh tests/release-ref-smoke.sh
      - name: Smoke-test installers
        run: bash tests/installer-smoke.sh
      - name: Smoke-test ref installers
        run: bash tests/release-ref-smoke.sh

  finalize_beta3:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/corpus-beta3-50'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout corpus branch
        uses: actions/checkout@v7
        with:
          ref: agent/corpus-beta3-50
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate 50/50 corpus
        run: npm test
      - name: Assert corpus counts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const corpus = JSON.parse(fs.readFileSync('skills/tryascia/references/korpus.json', 'utf8'));
          const actual = {
            records: corpus.record_count,
            accepted: corpus.accepted_record_count,
            candidate: corpus.candidate_record_count,
            runtime: Array.isArray(corpus.runtime_records) ? corpus.runtime_records.length : null,
          };
          if (actual.records !== 100 || actual.accepted !== 50 || actual.candidate !== 50 || actual.runtime !== 50) {
            throw new Error(`Unexpected corpus counts: ${JSON.stringify(actual)}`);
          }
          console.log('OK: 100 records; 50 accepted; 50 candidate; 50 runtime records.');
          NODE
      - name: Update README and remove temporary promotion scaffolding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text(encoding='utf-8')
          old = 'Корпус містить 100 форм: 30 мають exact anchor, 70 залишаються кандидатами для редакторської перевірки.'
          new = 'Корпус містить 100 форм: 50 мають exact anchor, 50 залишаються кандидатами для редакторської перевірки.'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('README corpus summary marker not found')
          p.write_text(text, encoding='utf-8')
          PY
          git fetch origin main:refs/remotes/origin/main --depth=1
          git show origin/main:.github/workflows/validate.yml > .github/workflows/validate.yml
          rm -f .github/workflows/promote-corpus-beta3.yml
          rm -f .github/workflows/promote-corpus-beta3-pr.yml
          rm -f BETA3_PLAN.md
      - name: Commit generated corpus and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finalize verified corpus at 50 anchors"
          git push origin HEAD:agent/corpus-beta3-50
