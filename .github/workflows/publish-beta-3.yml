name: Publish v0.1.0-beta.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-beta-3.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify release version
        run: |
          test "$(node -p "require('./package.json').version")" = "0.1.0-beta.3"
          test "$(node -p "require('./evals/evals.json').version")" = "0.1.0-beta.3"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/release-notes.md <<'EOF'
          ## ТРЯСЦЯ v0.1.0-beta.3

          - verified runtime-корпус розширено до 50 `accepted` форм;
          - release gate піднято до 50 `accepted` / максимум 50 `candidate`;
          - exact anchors винесено в структуровані JSON-файли;
          - валідатор перевіряє дублікати, URL, відповідність форм корпусу та accepted-лічильник;
          - generated corpus захищений від drift у CI;
          - Codex і Claude Code інсталятори перевірені локально та через remote ref.

          Це prerelease. Для встановлення використовуй тег `v0.1.0-beta.3`, а не `main`.
          EOF
          gh release create v0.1.0-beta.3 \
            --target "$GITHUB_SHA" \
            --title "v0.1.0-beta.3" \
            --prerelease \
            --notes-file /tmp/release-notes.md
