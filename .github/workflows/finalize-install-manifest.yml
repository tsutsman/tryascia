name: Finalize install manifest

on:
  push:
    branches:
      - agent/atomic-installers
    paths:
      - .github/workflows/finalize-install-manifest.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: agent/atomic-installers
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate and verify install manifest
        run: |
          set -euo pipefail
          npm run manifest:write
          npm test
          bash -n install.sh install-codex.sh install-hermes.sh install-openclaw.sh scripts/install-common.sh tests/installer-smoke.sh tests/release-ref-smoke.sh tests/installer-atomicity.sh
          bash tests/installer-smoke.sh
          bash tests/installer-atomicity.sh
      - name: Commit manifest and remove finalizer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-manifest.sha256
          if ! git diff --cached --quiet; then
            git commit -m "build: update install payload manifest"
          fi
          git rm .github/workflows/finalize-install-manifest.yml
          git commit -m "chore: remove install manifest finalizer"
          git push origin HEAD:agent/atomic-installers
