name: Finalize v1 corpus

on:
  push:
    branches:
      - agent/v1-corpus-and-release
    paths:
      - evals/verified-anchors-v1.json
      - evals/corpus-policy.json
      - scripts/validate-corpus.mjs
      - skills/tryascia/references/polityka-korpusu.md
      - skills/tryascia/references/verifikatsiya.md
      - .github/workflows/finalize-v1-corpus.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: agent/v1-corpus-and-release
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Generate and validate corpus
        run: npm test
      - name: Verify v1 counts
        run: |
          node - <<'NODE'
          const corpus = require('./skills/tryascia/references/korpus.json');
          if (corpus.record_count !== 100 || corpus.accepted_record_count !== 90 || corpus.candidate_record_count !== 10 || corpus.runtime_records.length !== 90) {
            throw new Error(`Unexpected v1 corpus counts: ${corpus.record_count}/${corpus.accepted_record_count}/${corpus.candidate_record_count}/${corpus.runtime_records.length}`);
          }
          NODE
      - name: Commit generated corpus and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tryascia/references/korpus.json
          git rm .github/workflows/finalize-v1-corpus.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: finalize v1 generated corpus"
          git push origin HEAD:agent/v1-corpus-and-release
