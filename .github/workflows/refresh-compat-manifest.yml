name: Refresh compatibility manifest

on:
  push:
    branches:
      - agent/compatibility-contract
    paths:
      - .github/workflows/refresh-compat-manifest.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/compatibility-contract
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Refresh and verify
        run: |
          node scripts/install-manifest.mjs --write
          npm test
          bash tests/compatibility-smoke.sh
      - name: Commit deterministic manifest and remove helper
        run: |
          rm -f .github/workflows/refresh-compat-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install-manifest.sha256 .github/workflows/refresh-compat-manifest.yml
          git commit -m "chore: refresh install manifest for compatibility contract"
          git push origin HEAD:agent/compatibility-contract
