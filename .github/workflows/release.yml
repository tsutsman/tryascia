name: Release ТРЯСЦЯ

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag in vX.Y.Z format'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Verify stable tag and release state
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Stable tag must match vX.Y.Z; got: $TAG" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          TARGET_SHA="$(git rev-list -n 1 "$TAG")"
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Release tag target is not contained in main: $TARGET_SHA" >&2
            exit 1
          }

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EVAL_VERSION="$(node -p "require('./evals/evals.json').version")"
          test "$TAG" = "v${PACKAGE_VERSION}" || {
            echo "Tag/package mismatch: $TAG vs $PACKAGE_VERSION" >&2
            exit 1
          }
          test "$EVAL_VERSION" = "$PACKAGE_VERSION" || {
            echo "evals/package mismatch: $EVAL_VERSION vs $PACKAGE_VERSION" >&2
            exit 1
          }

          npm test
          git diff --exit-code
          TRYASCIA_REF="$TAG" bash tests/release-ref-smoke.sh

          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build deterministic release archive and checksums
        id: assets
        shell: bash
        env:
          TARGET_SHA: ${{ steps.verify.outputs.target_sha }}
          VERSION: ${{ steps.verify.outputs.version }}
        run: |
          set -euo pipefail
          ASSET="tryascia-${VERSION}.tar.gz"
          git archive --format=tar --prefix="tryascia-${VERSION}/" "$TARGET_SHA" | gzip -n > "$ASSET"
          sha256sum "$ASSET" install-manifest.sha256 > SHA256SUMS
          sha256sum -c SHA256SUMS
          echo "archive=$ASSET" >> "$GITHUB_OUTPUT"

      - name: Create or repair stable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
          ARCHIVE: ${{ steps.assets.outputs.archive }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')" = "false"
            test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')" = "false"
            gh release upload "$TAG" "$ARCHIVE" SHA256SUMS install-manifest.sha256 \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" SHA256SUMS install-manifest.sha256 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --generate-notes
          fi

          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.draft')" = "false"
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.prerelease')" = "false"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$ARCHIVE"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'SHA256SUMS'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx 'install-manifest.sha256'
