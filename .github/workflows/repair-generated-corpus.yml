name: Repair generated corpus

on:
  push:
    branches:
      - agent/p0-p1-hardening
    paths:
      - .github/workflows/repair-generated-corpus.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v7
        with:
          ref: agent/p0-p1-hardening
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate corpus
        run: node scripts/validate-corpus.mjs
      - name: Commit generated corpus
        run: |
          if git diff --quiet -- skills/tryascia/references/korpus.json; then
            echo "Generated corpus is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/tryascia/references/korpus.json
          git commit -m "fix: regenerate machine corpus"
          git push origin HEAD:agent/p0-p1-hardening
