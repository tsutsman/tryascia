name: Finalize 1.1 corpus quality

on:
  push:
    branches:
      - agent/behavioral-evals-corpus-quality
    paths:
      - .github/workflows/finalize-behavior-quality.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/behavioral-evals-corpus-quality
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Apply reviewed replacements and regenerate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('skills/tryascia/references/korpus-100.md')
          text = path.read_text()
          replacements = {
              '| 41 | ебашити |': '| 41 | ібошити |',
              '| 42 | ебашить |': '| 42 | ібошить |',
              '| 43 | ебанутися |': '| 43 | їбанутися |',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one occurrence: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          node scripts/validate-corpus.mjs
          npm run manifest:write
          npm test

      - name: Commit deterministic generated state and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-behavior-quality.yml
          git add skills/tryascia/references/korpus-100.md skills/tryascia/references/korpus.json install-manifest.sha256
          git commit -m 'data: finalize 95/5 corpus quality state'
          git push origin HEAD:agent/behavioral-evals-corpus-quality
